<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, initial-scale=1, user-scalable=no">
<title>Bonbibi — panel</title>
<link rel="icon" type="image/png" href="/panel/favicon.png">
<link rel="stylesheet" href="/panel/tokens.css">
<link rel="stylesheet" href="/panel/app.css">
</head>
<body>
<div class="frame frame--idle" data-screen="IDLE" data-mode="default">

  <div class="idle-head">
    <svg class="idle-mark" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M3 22H1v-4h2v4Zm10 0H9v-2h4v2Zm-4-2H5v-2h4v2Zm8 0h-4v-2h4v2ZM5 18H3v-2h2v2Zm14 0h-2v-2h2v2Zm-8-2H5v-2h6v2Zm10 0h-2V4h2v12ZM5 14H3v-4h2v4Zm8 0h-2v-2h2v2Zm-6-4H5V8h2v2Zm6-2H7V6h6v2Zm4-2h-4V4h4v2Zm2-2h-2V2h2v2Z"/></svg>
    <span class="idle-wordmark">Bonbibi</span>
    <span class="idle-community" id="idle-community">&mdash;</span>
    <span class="idle-clock" id="idle-clock" aria-live="off">00:00:00</span>
  </div>

  <div class="idle-body">

    <div class="idle-selftest" id="idle-selftest" data-status-chip="no-information">
      <div class="idle-selftest__head">
        <span class="idle-selftest__word" id="selftest-word">CHECKING&hellip;</span>
        <span class="chrome-label" id="selftest-time"></span>
      </div>
      <ul class="idle-selftest__stages" id="selftest-stages"></ul>
      <p class="idle-selftest__remedy" id="selftest-remedy" hidden></p>
    </div>

    <div class="idle-fact-row">
      <div class="idle-fact" data-status-chip="no-information">
        <span class="chrome-label">POWER</span>
        <span class="idle-fact__value">NOT MONITORED</span>
        <span class="idle-fact__note">no state-of-charge telemetry on this kit &mdash; see docs/KIT.md</span>
      </div>
      <div class="idle-fact">
        <span class="chrome-label">TERRAIN</span>
        <span class="idle-fact__value" id="terrain-name">&mdash;</span>
        <span class="idle-fact__note" id="terrain-extent"></span>
      </div>
    </div>

    <div class="idle-actions">
      <button type="button" class="idle-primary" id="run-check" data-target="true">RUN FLOOD CHECK</button>
      <button type="button" class="idle-secondary" id="view-map" data-target="true">VIEW MAP</button>
    </div>
  </div>
</div>
<script src="/panel/idle.js"></script>
</body>
</html>
